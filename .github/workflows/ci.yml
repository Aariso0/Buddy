name: CI

# Development happens on `application`. This workflow only runs for PRs into `main`
# and pushes to `main`; merging `application` into `main` is what produces a release.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --tags --force
      - name: Decide whether the package version warrants a release
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('apps/desktop/package.json', 'utf8')).version")"
          TAGS="$(git tag --list 'v*')"

          # Semver precedence, not sort -V: a stable release outranks its own
          # prereleases and numeric prerelease identifiers compare numerically.
          RESULT="$(VERSION="$VERSION" TAGS="$TAGS" node -e '
          // Compare digit strings exactly: Number loses precision above 2^53.
          const cmpNum = (a, b) => a.length === b.length
            ? (a < b ? -1 : a > b ? 1 : 0)
            : (a.length < b.length ? -1 : 1);
          const parse = (s) => {
            const m = /^v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?(?:\+([0-9A-Za-z.-]+))?$/.exec(s);
            if (!m) return null;
            const pre = m[4] ? m[4].split(".") : [];
            const build = m[5] ? m[5].split(".") : [];
            // SemVer forbids empty identifiers and leading zeroes in numeric
            // prerelease identifiers; invalid tags must not suppress a release.
            if (build.some((id) => !id)) return null;
            if (pre.some((id) => !id || (/^\d+$/.test(id) && id.length > 1 && id[0] === "0"))) return null;
            return { n: [m[1], m[2], m[3]], p: pre };
          };
          const cmp = (a, b) => {
            for (let i = 0; i < 3; i++) {
              const order = cmpNum(a.n[i], b.n[i]);
              if (order) return order;
            }
            if ((a.p.length === 0) !== (b.p.length === 0)) return a.p.length ? -1 : 1;
            for (let i = 0; i < Math.min(a.p.length, b.p.length); i++) {
              const x = a.p[i], y = b.p[i], xn = /^\d+$/.test(x), yn = /^\d+$/.test(y);
              if (xn && yn) { const order = cmpNum(x, y); if (order) return order; }
              else if (xn !== yn) return xn ? -1 : 1;
              else if (x !== y) return x < y ? -1 : 1;
            }
            return Math.sign(a.p.length - b.p.length);
          };
          const version = parse(process.env.VERSION);
          if (!version) throw new Error(`invalid package version: ${process.env.VERSION}`);
          const entries = process.env.TAGS.split("\n")
            .map((tag) => ({ tag: tag.trim(), value: parse(tag.trim()) }))
            .filter((entry) => entry.value);
          let latest = null;
          for (const entry of entries) {
            if (!latest || cmp(entry.value, latest.value) > 0) latest = entry;
          }
          console.log(`version=${process.env.VERSION}`);
          console.log(`should_release=${!latest || cmp(version, latest.value) > 0}`);
          console.log(`latest_tag=${latest ? latest.tag : "none"}`);
          ')"
          echo "$RESULT" | grep -E '^(version|should_release)=' >> "$GITHUB_OUTPUT"
          echo "$RESULT"

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: pnpm --filter @buddy/desktop build

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: pnpm --filter @buddy/desktop build

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: pnpm --filter @buddy/desktop build

  package-linux:
    needs: [test-linux, test-windows, test-macos, prepare]
    if: github.event_name == 'push' && needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - name: Match Tauri config version to the release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "const fs = require('node:fs'); const p = 'apps/desktop/src-tauri/tauri.conf.json'; const c = JSON.parse(fs.readFileSync(p, 'utf8')); c.version = process.env.RELEASE_VERSION; fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');"
      - name: Build Linux bundles
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          pnpm --filter @buddy/desktop exec tauri build --bundles appimage,deb,rpm

          # Stage the legal files inside the distributed archive. Adding bundle
          # resources alone would not put them in the tar.gz we ship.
          stage="$(mktemp -d)"
          mkdir -p "$stage/legal"
          # NOTICE requires the MPL text to accompany the distribution. Keep a
          # copy in the repo: the MPL crates are not fetched on every target.
          cp NOTICE LICENSE LICENSE-MPL-2.0.txt "$stage/legal/"

          {
            echo "# MPL-2.0 source locations for Buddy $RELEASE_VERSION"
            echo
            echo "This build contains MPL-2.0 licensed crates and packages. Their complete"
            echo "corresponding source, at the exact versions below, is available from the"
            echo "registry named in each entry."
            echo
            awk '
              $3 == "MPL-2.0" && $2 ~ /^[0-9]/ {
                printf "- %s %s: https://crates.io/api/v1/crates/%s/%s/download\n", $1, $2, $1, $2
                next
              }
              $2 == "MPL-2.0" && $1 ~ /@[0-9]/ {
                spec = $1
                match(spec, /^.*@/)
                name = substr(spec, 1, RLENGTH - 1)
                version = substr(spec, RLENGTH + 1)
                printf "- %s: https://registry.npmjs.org/%s/-/%s-%s.tgz\n", spec, name, name, version
              }
            ' NOTICE
            echo
            echo "cssparser, cssparser-macros and dtoa-short ship the MPL-2.0 text as LICENSE"
            echo "in their crate sources; option-ext ships it as LICENSE.txt. The selectors"
            echo "crates ship no license file, so their upstream notice is kept at"
            echo "https://github.com/servo/servo/blob/main/LICENSE. The MPL-2.0 text is"
            echo "staged beside this file as LICENSE-MPL-2.0.txt."
          } > "$stage/legal/MPL-SOURCE-LOCATIONS.md"

          tar czf buddy-linux-x86_64.tar.gz \
            -C target/release buddy \
            -C "$stage" legal
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            buddy-linux-x86_64.tar.gz
          if-no-files-found: error

  package-windows:
    needs: [test-linux, test-windows, test-macos, prepare]
    if: github.event_name == 'push' && needs.prepare.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Match Tauri config version to the release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "const fs = require('node:fs'); const p = 'apps/desktop/src-tauri/tauri.conf.json'; const c = JSON.parse(fs.readFileSync(p, 'utf8')); c.version = process.env.RELEASE_VERSION; fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');"
      - name: Build Windows bundles
        run: pnpm --filter @buddy/desktop exec tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  package-macos:
    needs: [test-linux, test-windows, test-macos, prepare]
    if: github.event_name == 'push' && needs.prepare.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Match Tauri config version to the release tag
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node -e "const fs = require('node:fs'); const p = 'apps/desktop/src-tauri/tauri.conf.json'; const c = JSON.parse(fs.readFileSync(p, 'utf8')); c.version = process.env.RELEASE_VERSION; fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');"
      - name: Build macOS bundles
        run: pnpm --filter @buddy/desktop exec tauri build --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-macos
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Real-capture soaks. Both are dependencies of `publish`: a failed soak on
  # either OS blocks the release. Each exports chunk counts and gap markers via
  # an `if: always()` report step so a failure still carries those numbers.
  soak-linux:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 90
    outputs:
      chunk-summary: ${{ steps.report.outputs.chunk-summary }}
      gap-summary: ${{ steps.report.outputs.gap-summary }}
    steps:
      - name: Install Arch Linux audio and build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rust clang ffmpeg \
            pipewire pipewire-pulse pipewire-audio wireplumber libpulse
      - uses: actions/checkout@v4
      - name: Create a null sink and a null source, then start PipeWire
        run: |
          set -euo pipefail
          mkdir -p /etc/pipewire/pipewire.conf.d
          # The loopback module exposes its capture stream as an Audio/Sink and
          # its playback stream as an Audio/Source, so pipelines that play into
          # the null sink also feed the null source. No hardware is involved.
          cat > /etc/pipewire/pipewire.conf.d/soak-null-devices.conf <<'EOF'
          context.modules = [
            {
              name = libpipewire-module-loopback
              args = {
                node.description = "Buddy soak null devices"
                audio.rate = 48000
                audio.position = [ FL FR ]
                capture.props = {
                  node.name = "soak_null_sink"
                  node.description = "Buddy soak null sink"
                  media.class = "Audio/Sink"
                }
                playback.props = {
                  node.name = "soak_null_source"
                  node.description = "Buddy soak null source"
                  media.class = "Audio/Source"
                }
              }
            }
          ]
          EOF
          export XDG_RUNTIME_DIR=/run/user/0
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          pipewire &
          wireplumber &
          pipewire-pulse &
          for _ in $(seq 1 60); do
            pactl info >/dev/null 2>&1 && break
            sleep 1
          done
          pactl info
          pactl set-default-sink soak_null_sink
          pactl set-default-source soak_null_source
          pactl list short sinks
          pactl list short sources
      - name: Generate a 60-minute signal and run the real-capture soak
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR=/run/user/0
          SOAK_LOG="${RUNNER_TEMP}/soak.log"
          # 440 Hz tone at 48 kHz stereo, exactly 3600 seconds.
          ffmpeg -nostdin -hide_banner -loglevel error \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=3600" \
            -ac 2 -c:a pcm_s16le "${RUNNER_TEMP}/soak-tone.wav"
          pw-play "${RUNNER_TEMP}/soak-tone.wav" &
          PLAY_PID=$!
          sleep 2
          set +e
          BUDDY_AUDIO_SOAK=1 cargo test -p buddy-capture \
            --test linux_pipewire -- --nocapture 2>&1 | tee "${SOAK_LOG}"
          STATUS=${PIPESTATUS[0]}
          BUDDY_AUDIO_SOAK=1 cargo test -p buddy-capture \
            --test soak_real -- --ignored --nocapture 2>&1 | tee -a "${SOAK_LOG}"
          STATUS=$((STATUS + ${PIPESTATUS[0]}))
          kill "${PLAY_PID}" 2>/dev/null || true
          exit "${STATUS}"
      - name: Report soak chunk counts and gap markers
        id: report
        if: always()
        run: |
          SOAK_LOG="${RUNNER_TEMP:-/tmp}/soak.log"
          chunks="$(grep -E '^(System|Mic): [0-9]+ chunks' "${SOAK_LOG}" 2>/dev/null | tr '\n' ';' || true)"
          gaps="$(grep -E '^gaps: ' "${SOAK_LOG}" 2>/dev/null | tr '\n' ';' || true)"
          echo "chunk-summary=${chunks:-unavailable}" >> "$GITHUB_OUTPUT"
          echo "gap-summary=${gaps:-unavailable}" >> "$GITHUB_OUTPUT"
          {
            echo '### Soak results'
            echo "Chunk counts: ${chunks:-unavailable}"
            echo "Gap markers: ${gaps:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"

  soak-windows:
    if: github.event_name == 'push'
    # Self-hosted runner registered with these labels, with a real default
    # render endpoint and a real default capture endpoint. Hosted runners have
    # no audio endpoint, so this job must never run on windows-latest.
    runs-on: [self-hosted, windows, buddy-audio-soak]
    timeout-minutes: 90
    outputs:
      chunk-summary: ${{ steps.report.outputs.chunk-summary }}
      gap-summary: ${{ steps.report.outputs.gap-summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate a 60-minute signal and run the real-capture soak
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tone = Join-Path $env:RUNNER_TEMP 'soak-tone.wav'
          $rate = 48000
          $samples = $rate * 10
          $dataBytes = $samples * 2
          $stream = [System.IO.File]::Open($tone, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          $writer = [System.IO.BinaryWriter]::new($stream)
          $writer.Write([System.Text.Encoding]::ASCII.GetBytes('RIFF'))
          $writer.Write([uint32](36 + $dataBytes))
          $writer.Write([System.Text.Encoding]::ASCII.GetBytes('WAVE'))
          $writer.Write([System.Text.Encoding]::ASCII.GetBytes('fmt '))
          $writer.Write([uint32]16)
          $writer.Write([uint16]1)
          $writer.Write([uint16]1)
          $writer.Write([uint32]$rate)
          $writer.Write([uint32]($rate * 2))
          $writer.Write([uint16]2)
          $writer.Write([uint16]16)
          $writer.Write([System.Text.Encoding]::ASCII.GetBytes('data'))
          $writer.Write([uint32]$dataBytes)
          for ($i = 0; $i -lt $samples; $i++) {
            $writer.Write([int16][math]::Round(12000 * [math]::Sin(2 * [math]::PI * 440 * $i / $rate)))
          }
          $writer.Dispose()
          # WASAPI loopback captures the default render endpoint's mix, so a
          # looping generated tone is a 60-minute signal on that endpoint.
          $player = [System.Media.SoundPlayer]::new($tone)
          $player.PlayLooping()
          $log = Join-Path $env:RUNNER_TEMP 'soak.log'
          try {
            $env:BUDDY_AUDIO_SOAK = '1'
            cargo test -p buddy-capture --test windows_wasapi -- --nocapture 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "windows_wasapi integration tests failed ($LASTEXITCODE)" }
            cargo test -p buddy-capture --lib windows::tests -- --nocapture 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "windows::tests failed ($LASTEXITCODE)" }
            cargo test -p buddy-capture --test soak_real -- --ignored --nocapture 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "soak_real failed ($LASTEXITCODE)" }
          } finally {
            $player.Stop()
            $player.Dispose()
          }
      - name: Report soak chunk counts and gap markers
        id: report
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'soak.log'
          $lines = if (Test-Path $log) { Get-Content $log } else { @() }
          $chunks = (($lines | Where-Object { $_ -match '^(System|Mic): \d+ chunks' }) -join '; ')
          $gaps = (($lines | Where-Object { $_ -match '^gaps: ' }) -join '; ')
          if (-not $chunks) { $chunks = 'unavailable' }
          if (-not $gaps) { $gaps = 'unavailable' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "chunk-summary=$chunks"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "gap-summary=$gaps"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Soak results'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Chunk counts: $chunks"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Gap markers: $gaps"

  publish:
    needs: [prepare, package-linux, package-windows, package-macos, soak-linux, soak-windows]
    if: github.event_name == 'push' && needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create unsigned GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f)
          printf 'Uploading %d artifact file(s)\n' "${#files[@]}"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file .github/release-notes-template.md "${files[@]}"
