name: CI

# Development happens on `application`. This workflow only runs for PRs into `main`
# and pushes to `main`; merging `application` into `main` is what produces a release.
# Platform work lives in reusable workflows under .github/workflows/ci-*.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.version.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --tags --force
      - name: Decide whether the package version warrants a release
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('apps/desktop/package.json', 'utf8')).version")"
          TAGS="$(git tag --list 'v*')"
          RESULT="$(VERSION="$VERSION" TAGS="$TAGS" node .github/scripts/decide-release.js)"
          echo "$RESULT" | grep -E '^(version|should_release)=' >> "$GITHUB_OUTPUT"
          echo "$RESULT"

  test-linux:
    name: test-linux
    uses: ./.github/workflows/ci-test.yml
    with:
      os: ubuntu-latest

  test-windows:
    name: test-windows
    uses: ./.github/workflows/ci-test.yml
    with:
      os: windows-latest

  test-macos:
    name: test-macos
    uses: ./.github/workflows/ci-test.yml
    with:
      os: macos-latest

  package-linux:
    name: package-linux
    needs: [test-linux, test-windows, test-macos, prepare]
    if: github.event_name == 'push' && needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/ci-package.yml
    with:
      os: ubuntu-latest
      version: ${{ needs.prepare.outputs.version }}
      bundles: appimage,deb,rpm
      artifact-name: artifact-linux
      linux-extra-packages: rpm

  package-windows:
    name: package-windows
    needs: [test-linux, test-windows, test-macos, prepare]
    if: github.event_name == 'push' && needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/ci-package.yml
    with:
      os: windows-latest
      version: ${{ needs.prepare.outputs.version }}
      bundles: nsis
      artifact-name: artifact-windows

  package-macos:
    name: package-macos
    needs: [test-linux, test-windows, test-macos, prepare]
    if: github.event_name == 'push' && needs.prepare.outputs.should_release == 'true'
    uses: ./.github/workflows/ci-package.yml
    with:
      os: macos-latest
      version: ${{ needs.prepare.outputs.version }}
      bundles: dmg
      artifact-name: artifact-macos

  # Real-capture soak. A failed soak blocks the release, and the report step
  # exports chunk counts and gap markers even when the soak fails. The Windows
  # soak is disabled: hosted Windows runners cannot provide the capture endpoint
  # the Mic track needs, and no self-hosted audio-soak runner is registered.
  soak-linux:
    name: soak-linux
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci-soak-linux.yml

  publish:
    needs: [prepare, package-linux, package-windows, package-macos, soak-linux]
    if: github.event_name == 'push' && needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create unsigned GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist -type f)
          printf 'Uploading %d artifact file(s)\n' "${#files[@]}"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file .github/release-notes-template.md "${files[@]}"
