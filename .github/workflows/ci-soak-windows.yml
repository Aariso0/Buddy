name: CI - Windows soak

# Reusable real-capture soak for WASAPI loopback. The top-level ci.yml calls it
# only on push, and publish remains gated on the caller job.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  soak-windows:
    name: soak-windows
    # Self-hosted runner registered with these labels, with a real default
    # render endpoint and a real default capture endpoint. Hosted runners have
    # no audio endpoint, so this job must never run on windows-latest.
    runs-on: [self-hosted, windows, buddy-audio-soak]
    timeout-minutes: 90
    outputs:
      chunk-summary: ${{ steps.report.outputs.chunk-summary }}
      gap-summary: ${{ steps.report.outputs.gap-summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate a 60-minute signal and run the real-capture soak
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tone = Join-Path $env:RUNNER_TEMP 'soak-tone.wav'
          $rate = 48000
          $samples = $rate * 10
          $dataBytes = $samples * 2
          $stream = [System.IO.File]::Open($tone, [System.IO.FileMode]::Create, [System.IO.FileAccess]::Write)
          $writer = [System.IO.BinaryWriter]::new($stream)
          $writer.Write([System.Text.Encoding]::ASCII.GetBytes('RIFF'))
          $writer.Write([uint32](36 + $dataBytes))
          $writer.Write([System.Text.Encoding]::ASCII.GetBytes('WAVE'))
          $writer.Write([System.Text.Encoding]::ASCII.GetBytes('fmt '))
          $writer.Write([uint32]16)
          $writer.Write([uint16]1)
          $writer.Write([uint16]1)
          $writer.Write([uint32]$rate)
          $writer.Write([uint32]($rate * 2))
          $writer.Write([uint16]2)
          $writer.Write([uint16]16)
          $writer.Write([System.Text.Encoding]::ASCII.GetBytes('data'))
          $writer.Write([uint32]$dataBytes)
          for ($i = 0; $i -lt $samples; $i++) {
            $writer.Write([int16][math]::Round(12000 * [math]::Sin(2 * [math]::PI * 440 * $i / $rate)))
          }
          $writer.Dispose()
          # WASAPI loopback captures the default render endpoint's mix, so a
          # looping generated tone is a 60-minute signal on that endpoint.
          $player = [System.Media.SoundPlayer]::new($tone)
          $log = Join-Path $env:RUNNER_TEMP 'soak.log'
          try {
            $player.PlayLooping()
            $env:BUDDY_AUDIO_SOAK = '1'
            cargo test -p buddy-capture --test windows_wasapi -- --nocapture 2>&1 | Tee-Object -FilePath $log
            if ($LASTEXITCODE -ne 0) { throw "windows_wasapi integration tests failed ($LASTEXITCODE)" }
            cargo test -p buddy-capture --lib windows::tests -- --nocapture 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "windows::tests failed ($LASTEXITCODE)" }
            cargo test -p buddy-capture --test soak_real -- --ignored --nocapture 2>&1 | Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -ne 0) { throw "soak_real failed ($LASTEXITCODE)" }
          } finally {
            $player.Stop()
            $player.Dispose()
          }
      - name: Report soak chunk counts and gap markers
        id: report
        if: always()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'soak.log'
          $lines = if (Test-Path $log) { Get-Content $log } else { @() }
          $chunks = (($lines | Where-Object { $_ -match '^(System|Mic): \d+ chunks' }) -join '; ')
          $gaps = (($lines | Where-Object { $_ -match '^gaps: ' }) -join '; ')
          if (-not $chunks) { $chunks = 'unavailable' }
          if (-not $gaps) { $gaps = 'unavailable' }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "chunk-summary=$chunks"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "gap-summary=$gaps"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '### Soak results'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Chunk counts: $chunks"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Gap markers: $gaps"
