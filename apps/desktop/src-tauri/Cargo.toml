[package]
name = "buddy-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
autobins = false

[lib]
name = "buddy_desktop"
path = "src/lib.rs"

[[bin]]
name = "buddy"
path = "src/main.rs"

[dependencies]
buddy-capture = { path = "../../../crates/buddy-capture" }
buddy-core = { path = "../../../crates/buddy-core" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
uuid = { version = "1", features = ["v4"] }

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "=2.4.1"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
