[package]
name = "buddy-capture"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
buddy-core = { path = "../buddy-core" }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "=0.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio = { version = "=0.6.2", features = ["process-tap"] }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "=0.27.0"

[dev-dependencies]
tempfile = "3"
